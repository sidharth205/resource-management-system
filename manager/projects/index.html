<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RMS | Manager - Projects</title>
  <link rel="stylesheet" href="../../shared-assets/global.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../manager-theme.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="profile-section">
        <div class="avatar"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></div>
        <div class="welcome-text">Welcome<span id="userName">Manager</span></div>
      </div>
      <nav class="nav-menu">
        <a href="../dashboard/index.html" class="nav-item">Dashboard</a>
        <a href="../projects/index.html" class="nav-item active">Projects</a>
        <a href="../tasks/index.html" class="nav-item">Tasks</a>
        <a href="../timesheets/index.html" class="nav-item">Timesheets</a>
        <a href="../employees/index.html" class="nav-item">Employees</a>
        <a href="../reports/index.html" class="nav-item">Reports</a>
        <a href="../notifications/index.html" class="nav-item">Notifications<span class="nav-badge" id="navNotifBadge"></span></a>
        <a href="../profile/index.html" class="nav-item">My Profile</a>
      </nav>
      <button id="logoutBtn" class="logout-btn"><span class="logout-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path><path d="M21 19V5a2 2 0 0 0-2-2h-6"></path></svg></span>Logout</button>
    </aside>
    <main class="main-content">
      <header class="top-header">
        <div class="header-left">
          <button class="mobile-toggle-btn" id="mobileToggleBtn" aria-label="Toggle Navigation"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
          <h2>Projects</h2>
        </div>
        <div class="header-actions">
          <a href="../notifications/index.html" class="header-bell" title="Notifications">
            <span class="bell-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M10 21h4"></path></svg></span>
            <span class="bell-badge" id="bellBadge"></span>
          </a>
          <a href="../profile/index.html" class="header-profile" id="profileChip">
            <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
            <span id="headerName">Manager</span>
          </a>
        </div>
      </header>

      <div class="page-body">
        <section class="projects-intro">
          <div>
            <span class="eyebrow">Manager Workspace</span>
          </div>
          <button class="primary-btn" id="openNewProjectBtn"><span aria-hidden="true">+</span> New Project</button>
        </section>

        <section class="project-summary-grid" aria-label="Project summary">
          <div class="summary-tile"><span>Total projects</span><strong id="totalProjectsCount">--</strong></div>
          <div class="summary-tile summary-active"><span>Active</span><strong id="activeProjectsCount">--</strong></div>
          <div class="summary-tile summary-pending"><span>Pending</span><strong id="pendingProjectsCount">--</strong></div>
          <div class="summary-tile summary-completed"><span>Completed</span><strong id="completedProjectsCount">--</strong></div>
        </section>

        <div class="toolbar-card">
          <div class="search-box">
            <span class="search-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="m16 16 4 4"></path></svg></span>
            <input type="text" id="searchInput" placeholder="Search projects by name or description...">
          </div>
          <div class="filter-actions">
            <select id="statusFilter" class="glass-select">
              <option value="all">All Statuses</option>
              <option value="active">Active</option>
              <option value="completed">Completed</option>
              <option value="pending">Pending</option>
            </select>
          </div>
        </div>

        <div class="projects-grid" id="projectsGrid">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="projectModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>Create New Project</h3>
        <button class="modal-close-btn" id="closeModalBtn">×</button>
      </div>
      <form id="projectForm" class="modal-form">
        <div class="form-group">
          <label for="projectName">Project Name *</label>
          <input type="text" id="projectName" required placeholder="e.g. Cloud Migration Platform">
        </div>
        <div class="form-group">
          <label for="projectDesc">Description</label>
          <textarea id="projectDesc" rows="3" placeholder="Brief project scope and goals..."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="startDate">Start Date</label>
            <input type="date" id="startDate" aria-describedby="dateRangeHint">
          </div>
          <div class="form-group">
            <label for="endDate">End Date</label>
            <input type="date" id="endDate" aria-describedby="dateRangeHint">
          </div>
        </div>
        <p class="date-range-hint" id="dateRangeHint">End date must be on or after the start date.</p>
        <div class="modal-actions">
          <button type="button" class="cancel-btn" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="primary-btn" id="submitProjectBtn">Create Project</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="employeeAssignmentModal">
    <div class="modal-dialog member-modal-dialog">
      <div class="modal-header">
        <h3>Add Employees to Project</h3>
        <button class="modal-close-btn" id="closeMembersBtn" type="button">×</button>
      </div>
      <section class="project-members-step" id="projectMembersStep">
        <div class="member-assignment-form">
          <div class="form-group">
            <label for="employeeSearchInput">Search employees</label>
            <div class="employee-search-row">
              <input type="search" id="employeeSearchInput" placeholder="Search by name or EMP ID" class="glass-input">
              <button type="button" class="secondary-btn" id="searchEmployeesBtn">Search</button>
            </div>
            <div class="employee-search-results" id="employeeSearchResults"></div>
          </div>
          <div class="form-group">
            <label for="newMemberRole">Role on project</label>
            <input type="text" id="newMemberRole" placeholder="e.g. Frontend Engineer" class="glass-input">
          </div>
        </div>
        <div class="assigned-members" id="assignedMembersList">
        </div>
        <div class="modal-actions">
          <button type="button" class="cancel-btn" id="skipMembersBtn">Skip for now</button>
          <button type="button" class="primary-btn" id="addProjectMemberBtn">Add Employee</button>
          <button type="button" class="primary-btn" id="finishMembersBtn">Done</button>
        </div>
      </section>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="../../shared-assets/session-guard.js"></script>
  <script src="script.js"></script>
</body>
</html>
