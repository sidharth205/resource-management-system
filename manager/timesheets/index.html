<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RMS | Manager - Timesheets</title>
  <link rel="stylesheet" href="../../shared-assets/global.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="profile-section">
        <div class="avatar"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></div>
        <div class="welcome-text">WELCOME <span id="userName">MANAGER</span></div>
      </div>
      <nav class="nav-menu">
        <a href="../dashboard/index.html" class="nav-item">DASHBOARD</a>
        <a href="../projects/index.html" class="nav-item">PROJECTS</a>
        <a href="../tasks/index.html" class="nav-item">TASKS</a>
        <a href="../timesheets/index.html" class="nav-item active">TIMESHEETS</a>
        <a href="../employees/index.html" class="nav-item">EMPLOYEES</a>
        <a href="../reports/index.html" class="nav-item">REPORTS</a>
        <a href="../notifications/index.html" class="nav-item">NOTIFICATIONS <span class="nav-badge" id="navNotifBadge"></span></a>
        <a href="../profile/index.html" class="nav-item">MY PROFILE</a>
      </nav>
      <button id="logoutBtn" class="logout-btn"><span class="logout-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path><path d="M21 19V5a2 2 0 0 0-2-2h-6"></path></svg></span> LOGOUT</button>
    </aside>
    <main class="main-content">
      <header class="top-header">
        <div class="header-left">
          <button class="mobile-toggle-btn" id="mobileToggleBtn" aria-label="Toggle Navigation"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
          <h2>TIMESHEETS</h2>
        </div>
        <div class="header-actions">
          <a href="../notifications/index.html" class="header-bell" title="Notifications">
            <span class="bell-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M10 21h4"></path></svg></span>
            <span class="bell-badge" id="bellBadge"></span>
          </a>
          <a href="../profile/index.html" class="header-profile" id="profileChip">
            <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
            <span id="headerName">Manager</span>
          </a>
        </div>
      </header>

      <div class="timesheets-scrollable">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon stat-amber">
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">PENDING APPROVAL</span>
              <h2 id="statPending">--</h2>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon stat-blue">
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 15 15"></polyline></svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">TOTAL HOURS LOGGED</span>
              <h2 id="statTotalHours">--</h2>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon stat-green">
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px;"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">APPROVED TIMESHEETS</span>
              <h2 id="statApproved">--</h2>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon stat-red">
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px;"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">REJECTED TIMESHEETS</span>
              <h2 id="statRejected">--</h2>
            </div>
          </div>
        </div>

        <div class="toolbar-card">
          <div class="search-box">
            <span class="search-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="m16 16 4 4"></path></svg></span>
            <input type="text" id="timesheetSearch" placeholder="Search by employee, project or remarks...">
          </div>
          <div class="filter-group-row">
            <div class="date-filter-group">
              <label>From:</label>
              <input type="date" id="dateFrom" class="glass-date-input">
              <label>To:</label>
              <input type="date" id="dateTo" class="glass-date-input">
            </div>
            <select id="statusFilter" class="glass-select">
              <option value="all">All Statuses</option>
              <option value="pending">Pending</option>
              <option value="approved">Approved</option>
              <option value="rejected">Rejected</option>
            </select>
            <select id="projectFilter" class="glass-select">
              <option value="all">All Projects</option>
            </select>
          </div>
        </div>

        <div class="glass-card table-card">
          <div class="table-responsive">
            <table class="glass-table">
              <thead>
                <tr>
                  <th>EMPLOYEE</th>
                  <th>PROJECT</th>
                  <th>TASK / DATE</th>
                  <th>HOURS</th>
                  <th>REMARKS</th>
                  <th>STATUS</th>
                  <th>ACTIONS</th>
                </tr>
              </thead>
              <tbody id="timesheetsTableBody">
                <tr>
                  <td colspan="7" class="loading-cell"><div class="skeleton-row"></div></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="rejectModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>Reject Timesheet</h3>
        <button class="modal-close-btn" id="closeRejectModalBtn">×</button>
      </div>
      <form id="rejectForm" class="modal-form">
        <input type="hidden" id="rejectTimesheetId" value="">
        <div class="form-group">
          <label for="rejectReason">Reason for Rejection *</label>
          <textarea id="rejectReason" required rows="3" placeholder="Explain why this timesheet cannot be approved..." class="glass-input"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="cancel-btn" id="cancelRejectModalBtn">Cancel</button>
          <button type="submit" class="danger-btn" id="confirmRejectBtn">Reject Timesheet</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="../../shared-assets/session-guard.js"></script>
  <script src="script.js"></script>
</body>
</html>
