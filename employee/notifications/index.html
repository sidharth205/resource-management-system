<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMPLOYEE Notification</title>
    <link rel="stylesheet" href="../../shared-assets/global.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="profile-section">
                <div class="avatar">👤</div>
                <div class="welcome-text">WELCOME <br><span id="userName">NAME</span></div>
            </div>
            <nav class="nav-menu">
                <a href="../dashboard/index.html" class="nav-item">DASHBOARD</a>
                <a href="../assigned-tasks/index.html" class="nav-item">ASSIGNED TASK</a>
                <a href="../projects/index.html" class="nav-item">PROJECTS</a>
                <a href="index.html" class="nav-item active">NOTIFICATION</a>
                <a href="../profile/index.html" class="nav-item">MY PROFILE</a>
            </nav>
            <button id="logoutBtn" class="logout-btn">
                <span class="logout-icon">🚪</span> Logout
            </button>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Top Header Bar -->
            <header class="top-header">
                <div class="header-spacer"></div>
                <div class="header-actions">
                    <a href="index.html" style="text-decoration: none; color: inherit;">
                        <span class="bell-icon" title="Notifications">🔔</span>
                    </a>
                    <div class="header-profile-tag" onclick="window.location.href='../profile/index.html'" style="cursor: pointer;">
                        <span class="profile-icon-small">👤</span>
                        <span id="headerName">Name</span>
                    </div>
                </div>
            </header>

            <!-- Notifications Banner -->
            <div class="notifications-banner">
                <h1>Notifications</h1>
                <p>Stay updated with your tasks and activities</p>
            </div>

            <!-- Filter Tabs & Mark all as Read Row -->
            <div class="notif-controls-row">
                <div class="filter-tabs">
                    <button class="tab-btn active" data-filter="all">ALL</button>
                    <button class="tab-btn" data-filter="unread">UNREAD</button>
                    <button class="tab-btn" data-filter="read">READ</button>
                </div>
                <button id="markAllReadBtn" class="mark-read-link">Mark all as Read</button>
            </div>

            <!-- Notifications List Container -->
            <div id="notificationsContainer" class="notifications-list-container">
                <p style="color: #64748b; font-size: 0.8rem; text-align: center; padding: 20px;">Loading notifications...</p>
            </div>

            <!-- Footer View All Link -->
            <div class="footer-view-all">
                <a href="#" id="viewAllNotifsLink">View all Notifications</a>
            </div>
        </main>
    </div>

    <script src="../../shared-assets/breadcrumb.js"></script>
    <script src="script.js"></script>
</body>
</html>
