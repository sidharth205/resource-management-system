<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assigned Tasks</title>
    <link rel="stylesheet" href="../../shared-assets/global.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Ensures body and outer app container lock the viewport height */
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #dbeafe;
        }
        .app-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #c7d2fe 0%, #e0e7ff 100%);
        }
        /* Fixed Left Sidebar */
        .sidebar {
            width: 240px;
            height: 100vh;
            background: #c2d9ff;
            display: flex;
            flex-direction: column;
            padding-top: 15px;
            box-shadow: 2px 0 8px rgba(0,0,0,0.05);
            flex-shrink: 0;
        }
        /* Main Content Scrollable Wrapper */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px 35px;
            box-sizing: border-box;
            overflow: hidden;
        }
        .scrollable-task-window {
            flex: 1;
            overflow-y: auto;
            padding-right: 6px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation (Stays fixed and intact) -->
        <aside class="sidebar">
            <div class="profile-section">
                <div class="avatar">👤</div>
                <div class="welcome-text">WELCOME <br><span id="userName">-</span></div>
            </div>
            <nav class="nav-menu">
                <a href="../dashboard/index.html" class="nav-item">DASHBOARD</a>
                <a href="index.html" class="nav-item active">ASSIGNED TASKS</a>
                <a href="../projects/index.html" class="nav-item">PROJECTS</a>
                <a href="../notifications/index.html" class="nav-item">NOTIFICATION</a>
                <a href="../profile/index.html" class="nav-item">MY PROFILE</a>
            </nav>
            <button id="logoutBtn" class="logout-btn">
                <span class="logout-icon">🚪</span> Logout
            </button>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Top Header Bar -->
            <header class="top-header">
                <div class="header-spacer"></div>
                <div class="header-actions">
                    <a href="../notifications/index.html" style="text-decoration: none; color: inherit;">
                        <span class="bell-icon" title="Notifications">🔔</span>
                    </a>
                    <div class="header-profile-tag" onclick="window.location.href='../profile/index.html'" style="cursor: pointer;">
                        <span class="profile-icon-small">👤</span>
                        <span id="headerName">-</span>
                    </div>
                </div>
            </header>

            <!-- Page Title -->
            <div class="task-page-header-row">
                <h1>My Assigned Tasks</h1>
            </div>

            <!-- Scrollable Content Window: JS will inject multiple tasks here -->
            <!-- The timeline IDs and form inputs are created dynamically by your script.js inside this container -->
            <div class="scrollable-task-window" id="tasksContainer">
                <p>Loading tasks...</p>
            </div>

        </main>
    </div>

    <script src="../../shared-assets/breadcrumb.js"></script>
    <script src="script.js"></script>
</body>
</html>
