<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assigned Tasks</title>
    <link rel="stylesheet" href="../../shared-assets/global.css">
    <link rel="stylesheet" href="../employee-theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="profile-section">
                <div class="avatar"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></div>
                <div class="welcome-text">Welcome<span id="userName">-</span></div>
            </div>
            <nav class="nav-menu">
                <a href="../dashboard/index.html" class="nav-item">Dashboard</a>
                <a href="index.html" class="nav-item active">Assigned Tasks</a>
                <a href="../projects/index.html" class="nav-item">Projects</a>
                <a href="../notifications/index.html" class="nav-item">Notifications</a>
                <a href="../profile/index.html" class="nav-item">My Profile</a>
            </nav>
            <button id="logoutBtn" class="logout-btn" aria-label="Logout" title="Logout">
    <span class="logout-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path><path d="M21 19V5a2 2 0 0 0-2-2h-6"></path></svg></span>
    <span class="logout-label">Logout</span>
</button>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Top Header Bar -->
            <header class="top-header">
                <h2>Assigned Tasks</h2>
                <div class="header-actions">
                    <a href="../notifications/index.html" class="header-bell" aria-label="Notifications">
                        <span class="bell-icon" title="Notifications"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M10 21h4"></path></svg></span>
                    </a>
                    <a href="../profile/index.html" class="header-profile">
                        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
                        <span id="headerName">-</span>
                    </a>
                </div>
            </header>

            <!-- Scrollable Content Window: JS will inject multiple tasks here -->
            <div class="scrollable-task-window" id="tasksContainer">
                <p style="color: #64748b; font-size: 0.8rem;">Loading tasks...</p>
            </div>
        </main>
    </div>

    <script src="../../shared-assets/session-guard.js"></script>
    <script src="script.js"></script>
</body>
</html>
