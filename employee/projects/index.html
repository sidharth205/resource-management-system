<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMPLOYEE Projects</title>
    <link rel="stylesheet" href="../../shared-assets/global.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="profile-section">
                <div class="avatar"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></div>
                <div class="welcome-text">WELCOME <span id="userName">NAME</span></div>
            </div>
            <nav class="nav-menu">
                <a href="../dashboard/index.html" class="nav-item">DASHBOARD</a>
                <a href="../assigned-tasks/index.html" class="nav-item">ASSIGNED TASK</a>
                <a href="index.html" class="nav-item active">PROJECTS</a>
                <a href="../notifications/index.html" class="nav-item">NOTIFICATION</a>
                <a href="../profile/index.html" class="nav-item">MY PROFILE</a>
            </nav>
            <button id="logoutBtn" class="logout-btn">
                <span class="logout-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path><path d="M21 19V5a2 2 0 0 0-2-2h-6"></path></svg></span> Logout
            </button>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Top Header Bar -->
            <header class="top-header">
                <h2>PROJECTS</h2>
                <div class="header-actions">
                    <a href="../notifications/index.html" style="text-decoration: none; color: inherit;">
                        <span class="bell-icon" title="Notifications"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M10 21h4"></path></svg></span>
                    </a>
                    <div class="header-profile-tag" onclick="window.location.href='../profile/index.html'" style="cursor: pointer;">
                        <span class="profile-icon-small"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span>
                        <span id="headerName">Name</span>
                    </div>
                </div>
            </header>


            <!-- Top 2 Stat Cards Grid -->
            <div class="stats-grid-projects">
                <div class="stat-box card-blue">
                    <div class="stat-icon-wrapper blue-bg"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"></path><path d="M15 3v4h4M9 12h6M9 16h6"></path></svg></div>
                    <div class="stat-info">
                        <span class="stat-number" id="statTotalProjects">0</span>
                        <span class="stat-label">Total projects</span>
                    </div>
                </div>
                <div class="stat-box card-green">
                    <div class="stat-icon-wrapper green-bg"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12l3 3 5-6"></path></svg></div>
                    <div class="stat-info">
                        <span class="stat-number" id="statCompletedProjects">0</span>
                        <span class="stat-label">Completed</span>
                    </div>
                </div>
            </div>

            <!-- Projects Table Section Card -->
            <div class="section-card">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Project</th>
                                <th>Owner</th>
                                <th>Start Date</th>
                                <th>Due Date</th>
                            </tr>
                        </thead>
                        <tbody id="employeeProjectsTable">
                            <tr><td colspan="4" style="text-align: center; color: #64748b; padding: 20px;">Loading projects...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="table-footer-link">
                    <a href="#" id="viewAllProjectsLink">View All Projects <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></a>
                </div>
            </div>
        </main>
    </div>

    <script src="../../shared-assets/session-guard.js"></script>
    <script src="script.js"></script>
</body>
</html>
