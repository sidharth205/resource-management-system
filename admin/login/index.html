<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMS | Login</title>
    <link rel="stylesheet" href="../../shared-assets/global.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-wrap">
        <a class="back-link" href="../../landing.html">← Back to home</a>

        <div class="login-card">
            <div class="badge"><span></span><span></span><span></span><span></span></div>
            <h2>Welcome back</h2>
            <p class="sub">Login to access your dashboard</p>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>

                <div class="actions">
                    <button type="submit" class="btn-primary" id="loginBtn">Login</button>
                </div>
            </form>
            <div id="errorMessage" class="error-msg"></div>
            <div id="successMessage" class="success-msg" role="status" aria-live="polite"></div>

            <div class="help-text">
                New employee? <a href="#">Click here</a> to request login credentials
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
