<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResourceHub | Login</title>
    <script>
        if (new URLSearchParams(window.location.search).get('transition') === '1') {
            document.documentElement.classList.add('login-arriving');
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../shared-assets/global.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../admin-theme.css">
</head>
<body>
    <div class="login-scene" aria-hidden="true">
        <div class="login-shape login-shape-left"></div>
        <div class="login-shape login-shape-right"></div>
        <div class="feature-float feature-float-project">
            <span class="feature-float-icon"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M8 13h8M8 16h5"></path></svg></span>
            <span><strong>Projects</strong><small>Plans in one place</small></span>
            <i class="feature-float-status"></i>
        </div>
        <div class="feature-float feature-float-team">
            <span class="feature-float-icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"></circle><path d="M3 20a6 6 0 0 1 12 0M16 11a3 3 0 1 0 0-6M18 14a5 5 0 0 1 3 5"></path></svg></span>
            <span><strong>One connected team</strong><small>Admin · Manager · Employee</small></span>
        </div>
        <div class="feature-float feature-float-tasks">
            <span class="feature-float-icon"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg></span>
            <span><strong>Tasks moving forward</strong><small>Progress stays visible</small></span>
            <span class="feature-float-progress"><i></i></span>
        </div>
        <div class="feature-float feature-float-reports">
            <span class="feature-float-icon"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h17"></path><path d="m7 15 4-4 3 2 6-7"></path></svg></span>
            <span><strong>Clear progress</strong><small>Updates as work happens</small></span>
        </div>
    </div>

    <div class="login-wrap">
        <a class="back-link" href="../../Landing.html">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Back to home
        </a>

        <div class="login-card">
            <div class="badge"><span></span><span></span><span></span><span></span></div>
            <h2>Welcome back</h2>
            <p class="sub">Sign in to access your designated workspace</p>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Work Email</label>
                    <input type="email" id="email" required placeholder="you@company.com" autocomplete="email">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" required placeholder="Enter your password" autocomplete="current-password">
                        <button type="button" class="toggle-password" id="togglePasswordBtn" onclick="togglePasswordVisibility(event)" aria-label="Toggle password visibility" title="Show password">
                            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events: none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>


                <div class="actions">
                    <button type="submit" class="btn-primary" id="loginBtn">Sign In to Dashboard →</button>
                </div>
            </form>

            <div id="errorMessage" class="error-msg"></div>
            <div id="successMessage" class="success-msg" role="status" aria-live="polite"></div>

            <div class="help-text">
                Protected by Enterprise Role-Based Access Control
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
        if (document.documentElement.classList.contains('login-arriving')) {
            const params = new URLSearchParams(window.location.search);
            params.delete('transition');
            const query = params.toString();
            window.history.replaceState(null, '', `${window.location.pathname}${query ? `?${query}` : ''}${window.location.hash}`);
            window.setTimeout(() => document.documentElement.classList.remove('login-arriving'), 1500);
        }
    </script>
    <script src="script.js?v=4"></script>
</body>
</html>
