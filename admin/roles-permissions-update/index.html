<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMS | Update Role</title>
    <link rel="stylesheet" href="../../shared-assets/global.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="profile-section">
                <div class="avatar"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></div>
                <div class="welcome-text">WELCOME <span id="userName">ADMIN</span></div>
            </div>
            <nav class="nav-menu">
                <a href="../dashboard/index.html" class="nav-item">DASHBOARD</a>
                <a href="../user-management/index.html" class="nav-item">USER MANAGEMENT</a>
                <a href="../system-configuration/index.html" class="nav-item active">SYSTEM CONFIGURATION</a>
                <a href="../audit-monitoring/index.html" class="nav-item">AUDIT & MONITORING</a>
                <a href="../reports/index.html" class="nav-item">REPORTS</a>
                <a href="../profile/index.html" class="nav-item">MY PROFILE</a>
            </nav>
            <button id="logoutBtn" class="logout-btn"><span class="icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path><path d="M21 19V5a2 2 0 0 0-2-2h-6"></path></svg></span> Logout</button>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h2>SYSTEM CONFIGURATION</h2>
                <div class="header-actions">
                    <span class="bell-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M10 21h4"></path></svg></span>
                    <span class="header-profile"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg> <span id="headerName">Admin</span></span>
                </div>
            </header>

            <p class="breadcrumb">ROLES AND PERMISSIONS &gt; Update Role &gt; Confirm Update</p>

            <div class="role-update-layout">
                <div class="card dark-card">
                    <div class="card-top-row">
                        <span class="card-eyebrow">CONFIRM UPDATE</span>
                        <button class="btn-back" id="btnBack">Back ←</button>
                    </div>

                    <form id="updateRoleForm">
                        <div class="input-group">
                            <label>ROLE NAME</label>
                            <input type="text" id="roleName" required placeholder="e.g., Senior Developer, HR Lead" autocomplete="off">
                        </div>

                        <div class="input-group">
                            <label>DESCRIPTION</label>
                            <textarea id="roleDescription" rows="3" placeholder="Briefly describe what this role is for"></textarea>
                        </div>

                        <div class="permissions-section">
                            <label>PERMISSIONS</label>
                            <div class="permissions-grid" id="permissionsGrid">
                                <div class="permission-category">
                                    <h4>USER MANAGEMENT</h4>
                                    <label class="checkbox-label"><input type="checkbox" value="view_users"> View Employee List</label>
                                    <label class="checkbox-label"><input type="checkbox" value="create_users"> Create Employees</label>
                                    <label class="checkbox-label"><input type="checkbox" value="edit_users"> Edit Employees</label>
                                </div>

                                <div class="permission-category">
                                    <h4>PROJECTS & TASKS</h4>
                                    <label class="checkbox-label"><input type="checkbox" value="view_projects"> View Projects</label>
                                    <label class="checkbox-label"><input type="checkbox" value="manage_projects"> Manage Projects (Create/Assign)</label>
                                    <label class="checkbox-label"><input type="checkbox" value="view_tasks"> View Tasks</label>
                                    <label class="checkbox-label"><input type="checkbox" value="manage_tasks"> Manage Tasks</label>
                                    <label class="checkbox-label"><input type="checkbox" value="update_task_status"> Update Task Status</label>
                                </div>

                                <div class="permission-category">
                                    <h4>TIMESHEETS</h4>
                                    <label class="checkbox-label"><input type="checkbox" value="submit_timesheets"> Submit Timesheets</label>
                                    <label class="checkbox-label"><input type="checkbox" value="view_timesheets"> View Timesheets</label>
                                    <label class="checkbox-label"><input type="checkbox" value="approve_timesheets"> Approve/Reject Timesheets</label>
                                </div>

                                <div class="permission-category">
                                    <h4>SYSTEM & REPORTS</h4>
                                    <label class="checkbox-label"><input type="checkbox" value="view_reports"> View Utilization Reports</label>
                                    <label class="checkbox-label"><input type="checkbox" value="view_audit_logs"> View Audit Logs</label>
                                    <label class="checkbox-label"><input type="checkbox" value="manage_system"> Manage System Config</label>
                                    <label class="checkbox-label"><input type="checkbox" value="all" id="adminOverride"> Full Admin Access (Override)</label>
                                </div>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="button" class="btn-cancel" id="btnBackToEditing">Back To Editing</button>
                            <button type="submit" class="btn-save" id="btnConfirmUpdate">Confirm Update</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="../../shared-assets/session-guard.js"></script>
    <script src="script.js"></script>
</body>
</html>
